    \hline 2 & Mass & Kilogram & Kg \\
    \hline 3 & Time & Second & S \\
    \hline 4 & Electric Current & Ampere & A \\
    \hline 5 & Temperature & Kelvin & K \\
    \hline 6 & Luminous Intensity & Candela & Cd \\
    \hline 7 & Amount of Substance & Mole & mol \\
