    \section*{RECTILINEAR MOTION}

    Average Velocity (in an interval) :

    $$
    v_{a v}=\bar{v}=\langle v\rangle=\frac{\text { Total displacement }}{\text { Total time taken }}=\frac{\vec{r}_{\mathrm{f}}-\vec{r}_{\mathrm{i}}}{\Delta \mathrm{t}}
    $$

    Average Speed (in an interval)

    $$
    \text { Average Speed }=\frac{\text { Total distance travelled }}{\text { Total time taken }}
    $$

    Instantaneous Velocity (at an instant) :

    $$
    \vec{v}_{\mathrm{inst}}=\lim _{\Delta t \rightarrow 0}\left(\frac{\Delta \vec{r}}{\Delta t}\right)
    $$

    Average acceleration (in an interval):

    $$
    \vec{a}_{\mathrm{av}}=\frac{\Delta \overrightarrow{\mathrm{v}}}{\Delta \mathrm{t}}=\frac{\overrightarrow{\mathrm{v}}_{\mathrm{f}}-\overrightarrow{\mathrm{v}}_{\mathrm{i}}}{\Delta \mathrm{t}}
    $$

    Instantaneous Acceleration (at an instant):

    $$
    \vec{a}=\frac{d \vec{v}}{d t}=\lim _{\Delta t \rightarrow 0}\left(\frac{\overrightarrow{\Delta v}}{\Delta t}\right)
    $$

    Graphs in Uniformly Accelerated Motion along a straight line $(a \neq 0)$

    $x$ is a quadratic polynomial in terms of $t$. Hence $x-t$ graph is a parabola.

    x-t graph
    - $v$ is a linear polynomial in terms of $t$. Hence $v-t$ graph is a straight line of slope a.

    \section*{v-t graph}
    - a-t graph is a horizontal line because a is constant.

    \section*{a-t graph}

    \section*{Maxima \& Minima}

    $$
    \frac{d y}{d x}=0 \& \frac{d}{d x}\left(\frac{d y}{d x}\right)<0 \text { at maximum }
    $$

    and $\frac{d y}{d x}=0 \& \frac{d}{d x}\left(\frac{d y}{d x}\right)>0$ at minima.

    \section*{Equations of Motion (for constant acceleration)}

    (a) $\mathrm{v}=\mathrm{u}+\mathrm{at}$

    (b) $s=u t+\frac{1}{2} a t^{2} \quad s=v t-\frac{1}{2} a t^{2} \quad x_{f}=x_{i}+u t+\frac{1}{2} a t^{2}$

    (c) $v^{2}=u^{2}+2 a s$

    (d)

    $$
    s=\frac{(u+v)}{2} t
    $$

    (e) $s_{n}=u+\frac{a}{2}(2 n-1)$

    For freely falling bodies: $(u=0)$

    (taking upward direction as positive)

    (a) $v=-g t$

    (b) $s=-\frac{1}{2} g t^{2} \quad s=v t+\frac{1}{2} g t^{2} \quad h_{f}=h_{i}-\frac{1}{2} g t^{2}$

    (c) $v^{2}=-2 g s$

    (d) $s_{n}=-\frac{g}{2}(2 n-1)$

    \section*{PROJECTILE MOTION \& VECTORS}

    Time of flight :

    $$
    \mathrm{T}=\frac{2 \mathrm{u} \sin \theta}{\mathrm{g}}
    $$

    Horizontal range : $\quad \mathrm{R}=\frac{\mathrm{u}^{2} \sin 2 \theta}{\mathrm{g}}$

    Maximum height : $\mathrm{H}=\frac{\mathrm{u}^{2} \sin ^{2} \theta}{2 \mathrm{~g}}$

    Trajectory equation (equation of path) :

    $$
    y=x \tan \theta-\frac{g x^{2}}{2 u^{2} \cos ^{2} \theta}=x \tan \theta\left(1-\frac{x}{R}\right)
    $$

